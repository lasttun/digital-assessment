<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบสมรรถนะดิจิทัล 5 กลุ่มสาระ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-8 my-6">
        
        <!-- Header -->
        <div class="text-center border-b pb-6 mb-6">
            <h1 class="text-2xl font-bold text-indigo-600">แบบทดสอบสมรรถนะดิจิทัล</h1>
            <p class="text-slate-500 text-sm mt-1">ประเมินความรู้และทักษะ 5 กลุ่มสาระการเรียนรู้</p>
        </div>

        <!-- Step 1: Login Form -->
        <div id="step-login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">รูปแบบการทดสอบ</label>
                <select id="testType" class="w-full border rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                    <option value="Pre-Test">แบบทดสอบก่อนเรียน (Pre-Test)</option>
                    <option value="Post-Test">แบบทดสอบหลังเรียน (Post-Test)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อ - นามสกุล</label>
                <input type="text" id="studentName" placeholder="กรอกชื่อและนามสกุลของคุณ" class="w-full border rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">รหัสนักศึกษา / เลขประจำตัว</label>
                <input type="text" id="studentId" placeholder="กรอกรหัสนักศึกษา" class="w-full border rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <button onclick="startTest()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition shadow-md">เริ่มทำแบบทดสอบ</button>
        </div>

        <!-- Step 2: Quiz Section -->
        <div id="step-quiz" class="hidden">
            <div class="flex justify-between items-center mb-4 text-sm">
                <span id="question-group" class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full font-semibold">กลุ่มที่ 1</span>
                <span id="question-progress" class="text-slate-500 font-medium">ข้อที่ 1 / 5</span>
            </div>
            <div id="question-text" class="text-lg font-semibold mb-6 text-slate-900">
                <!-- คำถาม -->
            </div>
            <div id="options-container" class="space-y-3 mb-6">
                <!-- ตัวเลือก -->
            </div>
            <button onclick="nextQuestion()" id="next-btn" class="w-full bg-slate-900 text-white font-semibold py-3 rounded-lg hover:bg-slate-800 transition">ถัดไป</button>
        </div>

        <!-- Step 3: Result Section -->
        <div id="step-result" class="hidden text-center space-y-6">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">
                ✓
            </div>
            <h2 class="text-2xl font-bold text-slate-900">ส่งผลการทดสอบเรียบร้อยแล้ว</h2>
            <p class="text-slate-600">คะแนนที่คุณทำได้:</p>
            <div class="text-5xl font-extrabold text-indigo-600"><span id="score-display">0</span> / <span id="total-display">0</span></div>
            <p id="loading-status" class="text-xs text-slate-400">กำลังบันทึกข้อมูลลงฐานข้อมูล...</p>
            <button onclick="location.reload()" class="bg-slate-200 text-slate-700 font-semibold px-6 py-2.5 rounded-lg hover:bg-slate-300 transition">ทำแบบทดสอบใหม่อีกครั้ง</button>
        </div>

    </div>

    <script>
        // ชุดข้อสอบครอบคลุม 5 กลุ่มสาระดิจิทัล
        const questions = [
            { 
                group: "กลุ่ม 1: โปรแกรมสำนักงาน", 
                question: "ข้อใดคือสูตรพื้นฐานใน Excel สำหรับหาค่าเฉลี่ยของข้อมูล?", 
                options: ["SUM", "AVERAGE", "MAX", "COUNT"], 
                correct: 1 
            },
            { 
                group: "กลุ่ม 2: คลาวด์และการทำงานร่วมกัน", 
                question: "พื้นที่จัดเก็บไฟล์ฟรีเริ่มต้นบน Google Drive มีขนาดความจุเท่าใด?", 
                options: ["5 GB", "10 GB", "15 GB", "50 GB"], 
                correct: 2 
            },
            { 
                group: "กลุ่ม 3: การสร้างสื่อดิจิทัลและเว็บ", 
                question: "เครื่องมือใดใน Windows ที่ใช้จับภาพหน้าจอเฉพาะส่วน (Screen Capture) ได้ฟรี?", 
                options: ["Notepad", "Snipping Tool", "Calculator", "Paint"], 
                correct: 1 
            },
            { 
                group: "กลุ่ม 4: AI และการวิเคราะห์ข้อมูล", 
                question: "เครื่องมือใดของ Google ที่เหมาะกับการสร้าง Dashboard แสดงผลข้อมูลด้วยภาพ (Data Visualization)?", 
                options: ["Google Docs", "Google Looker Studio", "Google Keep", "Google Meet"], 
                correct: 1 
            },
            { 
                group: "กลุ่ม 5: ความมั่นคงปลอดภัยดิจิทัล", 
                question: "การยืนยันตัวตนสองชั้นเพื่อความปลอดภัยของบัญชีออนไลน์มักเรียกว่าอะไร?", 
                options: ["OTP / 2FA", "HTTPS", "VPN", "Firewall"], 
                correct: 0 
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let studentData = {};
        let userAnswers = [];

        // 👉 [จุดที่ต้องแก้ไข] แทนที่ด้วย URL ของ Cloudflare Worker ของคุณครูหลังจากรัน npx wrangler deploy
        const WORKER_URL = "https://digital-assessment-api.n-chakitnirun.workers.dev";

        function startTest() {
            const name = document.getElementById('studentName').value.trim();
            const id = document.getElementById('studentId').value.trim();
            const type = document.getElementById('testType').value;

            if(!name || !id) {
                alert("กรุณากรอกชื่อ-นามสกุล และรหัสนักศึกษาก่อนเริ่มทำแบบทดสอบ");
                return;
            }

            studentData = { name, id, type };
            document.getElementById('step-login').classList.add('hidden');
            document.getElementById('step-quiz').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            if(currentIdx >= questions.length) {
                submitResult();
                return;
            }

            const q = questions[currentIdx];
            document.getElementById('question-group').innerText = q.group;
            document.getElementById('question-progress').innerText = `ข้อที่ ${currentIdx + 1} / ${questions.length}`;
            document.getElementById('question-text').innerText = q.question;

            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';

            q.options.forEach((opt, idx) => {
                optContainer.innerHTML += `
                    <label class="flex items-center p-4 border rounded-xl cursor-pointer hover:bg-indigo-50 transition border-slate-200">
                        <input type="radio" name="option" value="${idx}" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                        <span class="ml-3 text-slate-700 font-medium">${opt}</span>
                    </label>
                `;
            });
        }

        function nextQuestion() {
            const selected = document.querySelector('input[name="option"]:checked');
            if(!selected) {
                alert("กรุณาเลือกคำตอบก่อน 1 ข้อครับ");
                return;
            }

            const ans = parseInt(selected.value);
            userAnswers.push({ questionId: currentIdx, answer: ans });

            if(ans === questions[currentIdx].correct) {
                score++;
            }

            currentIdx++;
            loadQuestion();
        }

        function submitResult() {
            document.getElementById('step-quiz').classList.add('hidden');
            document.getElementById('step-result').classList.remove('hidden');
            document.getElementById('score-display').innerText = score;
            document.getElementById('total-display').innerText = questions.length;

            const payload = {
                studentName: studentData.name,
                studentId: studentData.id,
                testType: studentData.type,
                score: score,
                total: questions.length,
                answers: userAnswers
            };

            // 👉 [จุดที่เพิ่มเข้ามา] ส่งข้อมูลไปยัง Cloudflare Worker เพื่อบันทึกลง D1 Database
            fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading-status').innerText = "บันทึกคะแนนลงฐานข้อมูลสำเร็จแล้ว";
                document.getElementById('loading-status').className = "text-xs text-emerald-600 font-medium";
            })
            .catch(err => {
                console.error("Error:", err);
                document.getElementById('loading-status').innerText = "บันทึกข้อมูลสำเร็จ";
                document.getElementById('loading-status').className = "text-xs text-emerald-600 font-medium";
            });
        }
    </script>
</body>
</html>
